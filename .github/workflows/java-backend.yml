name: Java backend verification
on:
  pull_request:
    paths: ['htt-backend-java/**', '.github/workflows/java-backend.yml']
  push:
    paths: ['htt-backend-java/**', '.github/workflows/java-backend.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: htt-backend-java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: htt-backend-java/pom.xml
      - run: mvn --batch-mode verify
      - name: Fresh database migration and repeatability
        run: python3 tests/stage4/migrations.py
      - name: Build API, worker and explicit migration images
        run: |
          docker build --target api -t htt-java-api:ci .
          docker build --target worker -t htt-java-worker:ci .
          docker build --target migrations -t htt-java-migrations:ci .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-verification
          path: |
            htt-backend-java/target/surefire-reports/
            htt-backend-java/target/stage4/
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        basis: [CASH, NON_CASH]
    defaults:
      run:
        working-directory: htt-backend-java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: htt-backend-java/pom.xml
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Install isolated PDF test dependencies
        run: |
          python3 -m venv /tmp/htt-java-pdf
          /tmp/htt-java-pdf/bin/pip install -r infra/stage4-test-requirements.txt
      - name: Full synthetic financial and client regression
        env:
          HTT_GST_BASIS: ${{ matrix.basis }}
          HTT_PYTHON: /tmp/htt-java-pdf/bin/python3
        run: python3 tests/compatibility/run.py --gst-basis "$HTT_GST_BASIS"
      - name: FIFO, returns, dispatch links and fake-provider workflows
        env:
          HTT_PYTHON: /tmp/htt-java-pdf/bin/python3
        run: |
          python3 - <<'PY'
          import pathlib, subprocess
          runs=[p.parent for p in pathlib.Path('target/compatibility').glob('*/PASSED') if (p.parent/'post-http.synthetic.pgdump').exists()]
          assert runs, 'No accepted synthetic regression snapshot'
          latest=max(runs,key=lambda p:p.stat().st_mtime)
          subprocess.run(['python3','tests/frontend-contracts/portal-sales.py','--snapshot',str(latest/'post-http.synthetic.pgdump')],check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-compatibility-${{ matrix.basis }}
          path: |
            htt-backend-java/target/surefire-reports/
            htt-backend-java/target/frontend-contracts/*/acceptance.json
            htt-backend-java/target/frontend-contracts/*/workflow-http-acceptance.json
            htt-backend-java/target/frontend-contracts/*/worker-probe.log
            htt-backend-java/target/compatibility/*/PASSED
            htt-backend-java/target/compatibility/*/run.log
