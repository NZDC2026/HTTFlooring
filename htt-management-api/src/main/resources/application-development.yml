# Explicit loopback-only business development. Use with database, never with local or in production.
server:
  address: 127.0.0.1
  port: 8070
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    disable-swagger-default-url: true
    persist-authorization: false
htt:
  customers:
    enabled: true
  auth:
    enabled: true
    local-enabled: true
    cookie-secure: false
  portal:
    branches-enabled: true
  notification:
    enabled: false
    workers-enabled: false
