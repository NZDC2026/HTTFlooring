appId: nz.co.httflooring.management
productName: HTT Flooring Management System
artifactName: "HTT-Flooring-Demo-${version}-${os}-${arch}.${ext}"
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - "!**/*.map"
  - "!**/*.test.*"
  - "!**/*.spec.*"
extraResources:
  - from: build/icon.png
    to: icon.png
asar: true
mac:
  category: public.app-category.business
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  icon: build/icon.png
  identity: null
  hardenedRuntime: false
dmg:
  title: "HTT Flooring Demo ${version}"
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
